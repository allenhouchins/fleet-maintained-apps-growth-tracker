name: Collect Windows App Security Info

on:
  workflow_dispatch:  # Allow manual triggering or triggered by update-data workflow
    inputs:
      force:
        description: 'Force re-collect all apps (ignore up-to-date)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write  # Required to commit changes
  actions: write   # Required to trigger other workflows

concurrency:
  group: "collect-security-info"  # Same group as macOS workflow to prevent concurrent runs
  cancel-in-progress: false  # Don't cancel in-progress runs, skip new ones instead

jobs:
  collect-security-info:
    runs-on: windows-latest  # Must run on Windows for Authenticode signature verification
    timeout-minutes: 120  # Longer timeout for app installations

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Collect Windows app security info
        run: |
          cd cmd/collect-security-info-windows && go run main.go ${{ github.event.inputs.force == 'true' && '--force' || '' }}

      - name: Regenerate HTML with security info
        run: |
          go run generate_html.go

      - name: Check for changes
        id: verify-changed-files
        shell: pwsh
        run: |
          $status = git status --porcelain
          if ($status) {
            echo "changed=true" >> $env:GITHUB_OUTPUT
          } else {
            echo "changed=false" >> $env:GITHUB_OUTPUT
          }

      - name: Commit and push changes
        if: steps.verify-changed-files.outputs.changed == 'true'
        shell: pwsh
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/app_security_info.json index.html
          $timestamp = Get-Date -Format 'yyyy-MM-dd HH:mm:ss UTC'
          git commit -m "Update Windows app security info - $timestamp"
          # Pull and merge any remote changes before pushing
          # Use merge strategy and resolve conflicts by regenerating index.html
          git fetch origin main
          # Try to merge remote changes
          git merge origin/main -m "Merge remote changes" 2>&1
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Merge conflict detected, resolving..."
            # Resolve data/app_security_info.json conflict by merging ours + theirs
            $unmerged = git diff --name-only --diff-filter=U
            if ($unmerged -match "data/app_security_info.json") {
              Write-Host "Merging app_security_info.json (ours + theirs)..."
              $oursPath = Join-Path $env:TEMP "ours.json"
              $theirsPath = Join-Path $env:TEMP "theirs.json"
              git show ":2:data/app_security_info.json" | Out-File -Encoding utf8 $oursPath
              git show ":3:data/app_security_info.json" | Out-File -Encoding utf8 $theirsPath
              go run scripts/merge-security-info.go $oursPath $theirsPath | Out-File -Encoding utf8 data/app_security_info.json
              git add data/app_security_info.json
            }
            # Resolve any index.html conflict by regenerating
            if (Test-Path "index.html") {
              go run generate_html.go
              git add index.html
            }
            git commit -m "Resolve merge conflict by merging security info"
          }
          git push origin main

      # Note: deploy-pages workflow is automatically triggered via workflow_run
      # when this workflow completes, so no need to manually trigger it

